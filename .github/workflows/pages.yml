name: Crawl and deploy Bibi
on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # GitHub có thể trễ vài phút ở giờ cao điểm; mỗi lượt crawl mất khoảng 1–3 phút.
    - cron: '*/30 * * * *'
permissions:
  contents: read
concurrency:
  group: bibi-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: data/listings.json
          key: bibi-data-${{ github.run_id }}
          restore-keys: bibi-data-
      - name: Restore previous listings from the live site when cache is empty
        run: |
          mkdir -p data
          [ -s data/listings.json ] || curl -fsSL "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/listings.json" -o data/listings.json || rm -f data/listings.json
      - run: python -m unittest discover -s tests -v
      - run: python build_pages.py --crawl
      - run: node --check dist/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
